<!doctype html>
<!--
  John Fredrick N. Lim, in print.
  A portfolio drawn entirely in code as a simulated risograph sheet: twelve
  isometric rooms, four spot inks, one HTML file, no images, fonts or libraries.

  The rooms, in order (chapter = section of the portfolio):
    I     Hello, I'm John ............ the studio by the sea window (intro)
    II    Engineering with Intention . the reading room (about, top skills)
    III   Hatchify ................... the capstone lab, egg incubator and chicks (education)
    IV    The Lecture Hall ........... teaching at ZPPSU, chalkboard of DSA, OOP and databases
    V     The Press Room ............. advising the Cyber Claw Publication
    VI    Game Night ................. coaching the esports team
    VII   The Hackathon .............. mentoring students through the night
    VIII  Freelance .................. the home office, a client call and wireframes
    IX    PokeClash .................. the retro game room (project)
    X     To-do List ................. the cork board and the vault door (project)
    XI    Calculator ................. the giant calculator and its receipt tape (project)
    XII   Let's Work Together ........ the mail room (contact)

  The recurring motif, like a signature, is John's teal coffee mug with a red
  band. It is in every room: on a desk, in chalk, on a pixel poster, on a
  stamp, hiding among trophies.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>John Fredrick N. Lim</title>
<meta name="description" content="Educator and developer from Zamboanga, Philippines. A portfolio printed in code.">

<style>

#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#card{--a:#F15060;position:fixed;left:28px;bottom:28px;width:min(390px,calc(100vw - 56px));max-height:calc(100vh - 56px);overflow:auto;box-sizing:border-box;padding:34px 32px 26px;
  color:#3D5588;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;background:#F4ECDB;box-shadow:0 14px 40px rgba(0,0,0,.45);
  opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);pointer-events:none}

<body>
<canvas id="c" aria-label="An illustrated risograph print of twelve rooms from John Fredrick Lim's work and life"></canvas>
<aside id="card" aria-live="polite"><canvas></canvas><div class="in"></div></aside>
<script>
'use strict';
/* =====================================================================
   1. Seeded randomness and noise
   ===================================================================== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1274126177);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return(a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*2-1;}
// periodic value noise, lattice wraps every P cells (for seamless tiles)
function pnoise(x,y,P,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const m=q=>((q%P)+P)%P;const a=hash2(m(xi),m(yi),s),b=hash2(m(xi+1),m(yi),s),c=hash2(m(xi),m(yi+1),s),d=hash2(m(xi+1),m(yi+1),s);
  return(a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*2-1;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, smooth=t=>t*t*(3-2*t);

/* =====================================================================
   2. The press: four spot inks, their screens and the paper
   Each ink has an integer screen vector (a,b). The dot lattice spanned by
   (a,b) and (-b,a) repeats on the pixel grid every (a²+b²)/gcd pixels, so
   a rotated halftone screen can be pre-rendered as a seamless tile.
   ===================================================================== */
const KEYS=['Y','R','T','N'];
const INKS=[
  {name:'Sunflower',   hex:'#FFB511', v:[4,0]},   //  0.0°
  {name:'Bright Red',  hex:'#F15060', v:[4,1]},   // 14.0°
  {name:'Teal',        hex:'#00838A', v:[1,4]},   // 76.0°
  {name:'Federal Blue',hex:'#3D5588', v:[3,3]},   // 45.0°, also the key/line ink
];
// misregistration of each plate, in world units
const MIS=[[1.5,-0.9],[-1.1,1.1],[0.8,1.4],[-0.25,0.2]];
const PAPER=[244,236,219], PAPER_HEX='#F4ECDB';
const R1=0.85;               // bake pixels per world unit at LOD 1 (a 4px screen cell is ~5 world units)
const KMAX=3;
function gcd(a,b){while(b){[a,b]=[b,a%b];}return a;}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
const scratch=mkCanvas(2,2).getContext('2d');

function inkTiles(i,k){
  const [a,b]=INKS[i].v,P=(a*a+b*b)/gcd(a,b),m=Math.ceil(100/P),T=P*m,TS=T*k,cell=Math.hypot(a,b);
  const rnd=mulberry(9001+i*77),dots=[],R=Math.ceil(T*1.6/cell)+3;
  for(let u=-R;u<=R;u++)for(let w=-R;w<=R;w++){
    const x=u*a-w*b,y=u*b+w*a;if(x<0||y<0||x>=T||y>=T)continue;
    dots.push([x+(rnd()-.5)*cell*.24,y+(rnd()-.5)*cell*.24,1+(rnd()-.5)*.18,rnd()]);
  }
  const out=[];
  for(let L=1;L<=10;L++){
    const cv=mkCanvas(TS,TS),c=cv.getContext('2d');c.fillStyle=INKS[i].hex;
    if(L===10){
      // solid: full ink with random dropout where the drum starved
      c.fillRect(0,0,TS,TS);c.globalCompositeOperation='destination-out';
      const r2=mulberry(333+i*5),n=Math.round(T*T/120);
      for(let q=0;q<n;q++){const x=r2()*TS,y=r2()*TS,rr=(.35+r2()*r2()*1.7)*k;c.globalAlpha=.3+r2()*.7;
        c.beginPath();c.ellipse(x,y,rr,rr*(.5+r2()*.6),r2()*3,0,TAU);c.fill();}
      c.globalAlpha=.12;for(let q=0;q<3;q++){const y=r2()*TS;c.fillRect(0,y,TS,(.6+r2())*k);}
    }else{
      const d=L/10;c.beginPath();
      for(const [x,y,sf,dr] of dots){
        if(dr<.03)continue;                         // a missing dot now and then
        let r=cell*Math.sqrt(d/Math.PI)*sf;if(d>.72)r*=1+(d-.72)*.45;
        for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const X=x+ox*T,Y=y+oy*T;
          if(X+r<0||Y+r<0||X-r>T||Y-r>T)continue;c.moveTo((X+r)*k,Y*k);c.arc(X*k,Y*k,r*k,0,TAU);}
      }
      c.fill();
    }
    out.push(scratch.createPattern(cv,'repeat'));
  }
  return out;
}
function paperTile(k){
  const T=160*k,cv=mkCanvas(T,T),c=cv.getContext('2d'),im=c.createImageData(T,T),D=im.data,sc=20*k;
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){
    const n=(hash2(x,y,5)-.5)*10+pnoise(x/sc,y/sc,8,6)*4+pnoise(x/(4*k),y/(4*k),40,8)*2.5,o=(y*T+x)*4;
    D[o]=PAPER[0]+n;D[o+1]=PAPER[1]+n;D[o+2]=PAPER[2]+n*1.25;D[o+3]=255;
  }
  c.putImageData(im,0,0);
  const r=mulberry(77);c.lineCap='round';
  for(let i=0;i<46;i++){const x=r()*T,y=r()*T,a=r()*TAU,l=(4+r()*16)*k;
    c.strokeStyle=r()<.55?'rgba(120,96,60,.10)':'rgba(255,255,248,.45)';c.lineWidth=(.35+r()*.6)*k;
    c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);c.stroke();}
  return {cv,pat:scratch.createPattern(cv,'repeat')};
}
function mottleTile(){
  const T=64,cv=mkCanvas(T,T),c=cv.getContext('2d'),im=c.createImageData(T,T),D=im.data;
  for(let y=0;y<T;y++)for(let x=0;x<T;x++){const n=pnoise(x/8,y/8,8,21)*.6+pnoise(x/3,y/3,21,22)*.4,o=(y*T+x)*4;
    D[o]=PAPER[0];D[o+1]=PAPER[1];D[o+2]=PAPER[2];D[o+3]=clamp(n*80+18,0,70);}
  c.putImageData(im,0,0);return scratch.createPattern(cv,'repeat');
}
const PAT=[];let MOTTLE=null;const SPC=new Map();
const INKRGB=INKS.map(k=>[1,3,5].map(o=>parseInt(k.hex.substr(o,2),16)/255));
// the colour a spec prints as when seen from far away (used for tiny figures)
function specColor(sp){const key=KEYS.map(k=>((sp[k]||0)*20|0)).join()+(sp.ko===false?'m':'');let c=SPC.get(key);if(c)return c;
  const r=sp.ko===false?[1,1,1]:PAPER.map(v=>v/255);for(let i=0;i<4;i++){const d=Math.min(1,sp[KEYS[i]]||0);for(let j=0;j<3;j++)r[j]*=1-d*(1-INKRGB[i][j]);}
  c='rgb('+r.map(v=>Math.round(v*255)).join()+')';SPC.set(key,c);return c;}
function getPat(k){if(!PAT[k]){PAT[k]={ink:INKS.map((_,i)=>inkTiles(i,k)),paper:paperTile(k).pat};}return PAT[k];}

/* =====================================================================
   3. The pen. Every mark goes through here: fills are knocked out of the
   paper and overprinted with multiply, one plate at a time, each plate
   shifted by its misregistration. Lines are tapered filled strokes.
   Coordinates are world units; the pen maps them to device pixels.
   ===================================================================== */
class Pen{
  constructor(ctx,s,k,v,ox,oy){
    this.c=ctx;this.s=s;this.k=k;this.v=v;this.ox=ox;this.oy=oy;this.n=0;this.P=getPat(k);
    const f=s/(k*R1);this.pm=new DOMMatrix([f,0,0,f,ox,oy]);
    this.seg=s>1.4?8:s>.7?13:s>.35?22:40;this.lo=s<.3;
  }
  // the boil: a smooth displacement field that changes with the variant
  W(x,y){const v=this.v*2.39996;return[this.ox+(x+1.1*Math.sin(y*.043+x*.017+v)+.55*Math.sin(x*.097-y*.061+v*1.7))*this.s,this.oy+(y+1.1*Math.sin(x*.047-y*.013+v*1.3)+.55*Math.sin(y*.089+x*.057+v*2.9))*this.s];}
  loop(path,pts,closed){
    const n=pts.length,seg=this.seg;let first=true;
    for(let i=0;i<(closed?n:n-1);i++){
      const a=pts[i],b=pts[(i+1)%n],L=Math.hypot(b[0]-a[0],b[1]-a[1]),m=Math.max(1,Math.ceil(L/seg));
      for(let j=0;j<m;j++){const t=j/m,q=this.W(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t);if(first){path.moveTo(q[0],q[1]);first=false;}else path.lineTo(q[0],q[1]);}
    }
    if(!closed){const q=this.W(pts[n-1][0],pts[n-1][1]);path.lineTo(q[0],q[1]);}
    path.closePath();
  }
  shape(loops){const p=new Path2D();for(const l of loops)if(l.length>1)this.loop(p,l,true);return p;}
  paper(path,rule){if(this.flat){this.c.globalCompositeOperation='source-over';this.c.fillStyle=PAPER_HEX;this.c.fill(path,rule);return;}const c=this.c,pp=this.P.paper;pp.setTransform(this.pm);c.globalCompositeOperation='source-over';c.fillStyle=pp;c.fill(path,rule);}
  ink(path,i,d,rule){
    if(this.flat){const c=this.c;c.globalCompositeOperation='multiply';c.globalAlpha=Math.min(1,d);c.fillStyle=INKS[i].hex;c.fill(path,rule);c.globalAlpha=1;c.globalCompositeOperation='source-over';return;}
    const c=this.c,L=clamp(Math.round(d*10),1,10),pt=this.P.ink[i][L-1];pt.setTransform(this.pm);
    c.globalCompositeOperation='multiply';c.fillStyle=pt;c.setTransform(1,0,0,1,MIS[i][0]*this.s,MIS[i][1]*this.s);
    c.fill(path,rule);c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-over';
  }
  // sp = {Y,R,T,N densities 0..1, ko:knockout (default true), ol:outline width, oi:outline ink, eo:evenodd}
  fill(pts,sp){if(!sp)return this;return this.fillL([pts],sp);}
  fillL(loops,sp){
    const path=this.shape(loops),rule=sp.eo?'evenodd':'nonzero';
    if(this.flat){const c=this.c;c.globalCompositeOperation=sp.ko===false?'multiply':'source-over';c.fillStyle=specColor(sp);c.fill(path,rule);c.globalCompositeOperation='source-over';return this;}
    if(sp.ko!==false)this.paper(path,rule);
    for(let i=0;i<4;i++){const d=sp[KEYS[i]];if(d>.03)this.ink(path,i,d,rule);}
    if(sp.ol&&!this.lo)for(const l of loops)this.outline(l,sp.ol,sp.oi??3);
    return this;
  }
  // tapered, wobbling hand line. ink -1 draws in paper (chalk, highlights)
  line(pts,w,ink=3,o={}){
    if(pts.length<2)return this;
    const id=this.n++,s=this.s,seg=this.seg*.8,J=o.j??.8,sd=id*13.37+this.v*71.3;
    const q=[];
    for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i],[x1,y1]=pts[i+1],L=Math.hypot(x1-x0,y1-y0),m=Math.max(1,Math.ceil(L/seg));
      for(let j=0;j<m;j++){const t=j/m;q.push([x0+(x1-x0)*t,y0+(y1-y0)*t]);}}
    q.push(pts[pts.length-1]);
    const ov=o.ov??1;
    if(ov&&q.length>1){const n=q.length,a=q[0],b=q[1],c=q[n-1],d=q[n-2];
      const la=Math.hypot(a[0]-b[0],a[1]-b[1])||1,lc=Math.hypot(c[0]-d[0],c[1]-d[1])||1;
      q[0]=[a[0]+(a[0]-b[0])/la*ov,a[1]+(a[1]-b[1])/la*ov];q[n-1]=[c[0]+(c[0]-d[0])/lc*ov,c[1]+(c[1]-d[1])/lc*ov];}
    const n=q.length,P=new Array(n);
    for(let i=0;i<n;i++){const t=i/(n-1);P[i]=this.W(q[i][0]+J*Math.sin(t*4.3+sd)*Math.cos(t*2.1+sd*.7),q[i][1]+J*Math.sin(t*3.7+sd*1.3+2)*Math.cos(t*1.7+sd));}
    const Lf=[],Rt=[],base=w*s*.5;
    for(let i=0;i<n;i++){
      const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
      const t=i/(n-1),tp=o.flat?1:.28+.72*Math.pow(Math.sin(Math.PI*t),.55);
      const hw=Math.max(.38,base*tp*(1+.18*Math.sin(t*9+sd*2.3)));
      Lf.push([P[i][0]-dy*hw,P[i][1]+dx*hw]);Rt.push([P[i][0]+dy*hw,P[i][1]-dx*hw]);
    }
    const path=new Path2D();path.moveTo(Lf[0][0],Lf[0][1]);for(let i=1;i<n;i++)path.lineTo(Lf[i][0],Lf[i][1]);
    for(let i=n-1;i>=0;i--)path.lineTo(Rt[i][0],Rt[i][1]);path.closePath();
    if(ink<0)this.paper(path,'nonzero');else this.ink(path,ink,o.d??1,'nonzero');
    return this;
  }
  // closed outline, lifted at corners like a hand-drawn contour
  outline(pts,w,ink=3,o={}){
    const n=pts.length;if(n<3){this.line(pts,w,ink,o);return this;}
    const cor=[];
    for(let i=0;i<n;i++){const a=pts[(i-1+n)%n],b=pts[i],c=pts[(i+1)%n];
      let d=Math.abs(Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0]));if(d>Math.PI)d=TAU-d;if(d>.62)cor.push(i);}
    if(cor.length<2){const h=n>>1;this.line(pts.slice(0,h+1),w,ink,o);this.line(pts.slice(h).concat([pts[0],pts[1]]),w,ink,o);return this;}
    for(let j=0;j<cor.length;j++){const i0=cor[j],i1=cor[(j+1)%cor.length],sg=[pts[i0]];let i=i0;while(i!==i1){i=(i+1)%n;sg.push(pts[i]);}this.line(sg,w,ink,o);}
    return this;
  }
}
/* A recorder with the pen's drawing interface, so a scene is described once
   and replayed per boil variant, a few operations per frame. */
class Rec{constructor(){this.ops=[];}
  fill(a,b){this.ops.push([0,a,b]);return this;} fillL(a,b){this.ops.push([1,a,b]);return this;}
  line(a,b,c,d){this.ops.push([2,a,b,c,d]);return this;} outline(a,b,c,d){this.ops.push([3,a,b,c,d]);return this;}}
function play(op,p){switch(op[0]){case 0:p.fill(op[1],op[2]);break;case 1:p.fillL(op[1],op[2]);break;case 2:p.line(op[1],op[2],op[3],op[4]||{});break;case 3:p.outline(op[1],op[2],op[3],op[4]||{});}}

/* =====================================================================
   4. Colour specs and geometry helpers
   ===================================================================== */
const S=(Y=0,R=0,T=0,N=0,o)=>Object.assign({Y,R,T,N,ol:1.1},o||{});
const dk=(sp,a)=>Object.assign({},sp,{N:Math.min(1,(sp.N||0)+a)});
const noOl=sp=>Object.assign({},sp,{ol:0});
const TONE={
  wood:S(.45,.22,0,.1), woodD:S(.5,.32,0,.32), woodL:S(.3,.1,0,0),
  cream:S(.06,.02), white:S(0,0,0,0), navy:S(0,0,0,.9), ink:S(0,.15,0,1),
  teal:S(0,0,.75), tealL:S(0,0,.3), red:S(0,.8), redL:S(0,.3), yel:S(.85), yelL:S(.35),
  green:S(.55,0,.6,.05), greenD:S(.45,0,.7,.3), metal:S(0,0,.12,.35), metalL:S(0,0,.08,.15),
  glass:S(.04,0,.16,.02), sky:S(.1,.04,.14,0), screen:S(0,0,.35,.55), orange:S(.8,.4), brown:S(.45,.4,0,.45), purple:S(0,.45,0,.45),
};
const ellipse=(cx,cy,rx,ry,n=18,rot=0)=>{const o=[],c=Math.cos(rot),s=Math.sin(rot);for(let i=0;i<n;i++){const a=i/n*TAU,x=Math.cos(a)*rx,y=Math.sin(a)*ry;o.push([cx+x*c-y*s,cy+x*s+y*c]);}return o;};
const rect=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
// catmull-rom smoothing
function smoothPts(pts,closed=true,seg=3){const n=pts.length,o=[];
  for(let i=0;i<(closed?n:n-1);i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    for(let j=0;j<seg;j++){const t=j/seg,t2=t*t,t3=t2*t;
      o.push([.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),

/* =====================================================================

const surf=(W,u,v,w,h)=>(s,t)=>W(u+s*w,v+h-t*h);

function box(p,x,y,z,w,d,h,sp,o={}){
  const A=iso(x,y,z+h),B=iso(x+w,y,z+h),C=iso(x+w,y+d,z+h),D=iso(x,y+d,z+h),E=iso(x+w,y,z),F=iso(x+w,y+d,z),G=iso(x,y+d,z);

function cyl(p,x,y,z,r,h,sp,o={}){

function band(p,x,y,z,r,h,sp){ // a painted stripe round the front of a cylinder

// stepped halftone light: concentric rings of rising density, never a gradient

const floorRings=(p,x,y,z,r,steps,ink,dmax,rr)=>rings(p,f=>isoEl(x,y,z,r*f,24,(rr??r)*f),steps,ink,dmax);

/* ---------- the room shell ---------- */
function shell(p,o){

  p.fill(rect(0,0,CW,CH),Object.assign({ol:0},o.panel));

  const t=.45;

  p.fill([iso(10,0,0),iso(10,10,0),iso(10,10,-t),iso(10,0,-t)],S(0,0,0,.4,{ol:1.2}));

    const r=mulberry(o.seed||3);for(let i=0;i<14;i++){const y0=i*10/14,y1=(i+1)*10/14;for(let j=0;j<2;j++){const x=r()*9.5+.2;p.line([iso(x,y0,0),iso(x,y1,0)],.7,3,{d:.5});}}}
  if(o.tiles){for(let i=1;i<10;i++){p.line([iso(i,0,0),iso(i,10,0)],.7,3,{d:.5});p.line([iso(0,i,0),iso(10,i,0)],.7,3,{d:.5});}
    for(let i=0;i<10;i++)for(let j=0;j<10;j++)if((i+j)%2)p.fill(fq(i,j,1,1),Object.assign({ol:0,ko:false},o.tiles));}

  box(p,0,0,0,.08,10,.25,o.trim||TONE.cream,{lw:.8});box(p,0,0,0,10,.08,.25,o.trim||TONE.cream,{lw:.8});

  p.fill([iso(-th,10,0),iso(0,10,0),iso(0,10,WH),iso(-th,10,WH)],dk(cap,.2));
  p.fill([iso(10,-th,0),iso(10,0,0),iso(10,0,WH),iso(10,-th,WH)],dk(cap,.3));
  p.fill([iso(-th,10,-t),iso(0,10,-t),iso(0,10,0),iso(-th,10,0)],dk(cap,.25));
  p.fill([iso(10,-th,-t),iso(10,0,-t),iso(10,0,0),iso(10,-th,0)],dk(cap,.35));
  // corner seam + floor edges
  p.line([iso(0,0,0),iso(0,0,WH)],1.2);p.line([iso(0,10,0),iso(10,10,0)],1.5);p.line([iso(10,0,0),iso(10,10,0)],1.5);
  p.line([iso(0,0,0),iso(0,10,0)],1.1);p.line([iso(0,0,0),iso(10,0,0)],1.1);
}

  for(const combo of [['Y','R'],['Y','T'],['R','T'],['R','N'],['T','N'],['Y','R','T']]){const sp={ko:true,ol:0};combo.forEach(k=>sp[k]=.9);p.fill(rect(x,y0,sw,sw),sp);x+=sw;}
  // colour bar along the top
  for(let j=0;j<24;j++){const sp={ko:true,ol:0};sp[KEYS[j%4]]=[1,.5,.25][Math.floor(j/4)%3];p.fill(rect(bx+j*sw*.5,by/2-sw*.25,sw*.5,sw*.5),sp);}
  // the block's frame and gutters
  p.outline(rect(bx,by,bw,bh),2.4,3,{j:.3});
  for(let c=1;c<COLS;c++)p.line([[bx+c*CW,by],[bx+c*CW,by+bh]],1.4,3,{j:.3,flat:1});
  for(let r=1;r<ROWS;r++)p.line([[bx,by+r*CH],[bx+bw,by+r*CH]],1.4,3,{j:.3,flat:1});
  CHROME=p.ops;
}

/* =====================================================================
   10. Baking: each room is replayed through the pen into three boil
   variants per level of detail, a slice of work per frame.
   ===================================================================== */
const Q=[];let job=null;const LRU=[];
function recordRooms(){ROOMS.forEach((r,i)=>{const p=new Rec();r.build(p);r.ops=p.ops;r.bk=[];r.i=i;r.figs.forEach((f,j)=>compilePlan(f,i*10+j));});}
function want(r,k,v,front){if(r.bk[k]&&r.bk[k][v])return;if(Q.some(j=>j.r===r&&j.k===k&&j.v===v))return;if(job&&job.r===r&&job.k===k&&job.v===v)return;const j={r,k,v};front?Q.unshift(j):Q.push(j);}
function stepBake(budget){
  const end=performance.now()+budget;let done=false;
  while(performance.now()<end){
    if(!job){const j=Q.shift();if(!j)break;const s=j.k*R1,cv=mkCanvas(CW*s,CH*s),c=cv.getContext('2d');
      const pen=new Pen(c,s,j.k,j.v,0,0),pa=new Path2D();pa.rect(0,0,cv.width,cv.height);pen.paper(pa,'nonzero');job=Object.assign(j,{cv,c,pen,i:0});}
    const ops=job.r.ops;
    while(job.i<ops.length&&performance.now()<end)play(ops[job.i++],job.pen);
    if(job.i>=ops.length){
      const c=job.c;MOTTLE=MOTTLE||mottleTile();MOTTLE.setTransform(new DOMMatrix([7*job.k,0,0,7*job.k,0,0]));c.fillStyle=MOTTLE;c.fillRect(0,0,job.cv.width,job.cv.height);
      const r=job.r;(r.bk[job.k]=r.bk[job.k]||[])[job.v]=job.cv;if(job.k===1&&job.v===0)r.ready=r.ready||now();
      if(job.k>1){const key=r.i+':'+job.k,ix=LRU.indexOf(key);if(ix>=0)LRU.splice(ix,1);LRU.push(key);
        while(LRU.length>3){const [ri,k]=LRU.shift().split(':').map(Number);if(ROOMS[ri].bk[k]){ROOMS[ri].bk[k]=null;}}}
      job=null;done=true;
    }
  }
  return done;
}
function pickBake(r,k,v){
  for(let d=0;d<KMAX;d++)for(const kk of [k-d,k+d]){const b=r.bk[kk];if(b){if(b[v])return b[v];for(const c of b)if(c)return c;}}
  return null;
}

/* =====================================================================
   11. Camera, tour, input
   ===================================================================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let DPR=1,VW=0,VH=0;const cam={x:0,y:0,z:.2};let fly=null,vel={x:0,y:0},lastInput=-1e9,dirty=true;
const now=()=>performance.now()/1000;
function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  const oc=COLS;layout();if(oc!==COLS&&settled>=0)focusRoom(settled,true);dirty=true;}
const fitSheetZ=()=>Math.min(VW/(SW*1.02),VH/(SH*1.02));
const zMin=()=>fitSheetZ()*.6,zMax=()=>KMAX*R1*1.3/DPR;
function roomView(i){
  const r=ROOMS[i],portrait=VW<700;let z,cx=r.x+CW/2,cy=r.y+CH/2;
  if(portrait){z=Math.min(VW*.98/CW,VH*.55/CH);cy+=VH*.2/z;}
  else{z=Math.min(VW*.9/CW,VH*.94/CH);const cardW=Math.min(400,VW*.34);if(VW-CW*z<cardW*2+40)cx-=Math.min(cardW*.55,(VW-CW*z)/2+cardW*.5-20)/z;}
  return{x:cx,y:cy,z};
}
function flyTo(v,dur,done){const d=Math.hypot(v.x-cam.x,v.y-cam.y)*Math.min(cam.z,v.z)/Math.min(VW,VH);
  fly={x0:cam.x,y0:cam.y,z0:cam.z,x1:v.x,y1:v.y,z1:v.z,t0:now(),dur:dur??clamp(1.4+Math.log(1+d)*.7,1.2,3.2),bump:clamp(Math.log(1+d)*.55,0,1.3),done};hideCard();}
function focusRoom(i,instant){const v=roomView(i);if(instant){Object.assign(cam,{x:v.x,y:v.y,z:v.z});return;}flyTo(v,null,()=>{settle(i);});}
function stepFly(){if(!fly)return;const t=clamp((now()-fly.t0)/fly.dur,0,1),e=ease(t),ep=ease(clamp(t*1.12,0,1));
  cam.z=Math.exp(lerp(Math.log(fly.z0),Math.log(fly.z1),e)-fly.bump*Math.sin(Math.PI*e));cam.x=lerp(fly.x0,fly.x1,ep);cam.y=lerp(fly.y0,fly.y1,ep);dirty=true;
  if(t>=1){const d=fly.done;fly=null;if(d)d();}}
function zoomAt(px,py,f){const wx=cam.x+(px-VW/2)/cam.z,wy=cam.y+(py-VH/2)/cam.z;cam.z=clamp(cam.z*f,zMin(),zMax());cam.x=wx-(px-VW/2)/cam.z;cam.y=wy-(py-VH/2)/cam.z;clampCam();dirty=true;}
function clampCam(){cam.x=clamp(cam.x,0,SW);cam.y=clamp(cam.y,0,SH);}
function roomAt(px,py){const wx=cam.x+(px-VW/2)/cam.z,wy=cam.y+(py-VH/2)/cam.z;return ROOMS.findIndex(r=>wx>=r.x&&wx<r.x+CW&&wy>=r.y&&wy<r.y+CH);}

// tour
const TOUR={i:-1,holdUntil:0,paused:false,started:false};let T0=0,settled=-1,manualSettleAt=0;
function tourNext(){const n=TOUR.i+1;
  if(n>=ROOMS.length){TOUR.i=-1;flyTo({x:SW/2,y:SH/2,z:fitSheetZ()},2.4,()=>{TOUR.holdUntil=now()+4;});return;}
  TOUR.i=n;prebake(n);flyTo(roomView(n),null,()=>{settle(n);TOUR.holdUntil=now()+9;if(n+1<ROOMS.length)prebake(n+1);});}
function prebake(i){const v=roomView(i),k=clamp(Math.ceil(v.z*DPR/R1-.25),1,KMAX);if(k>1)for(let j=0;j<3;j++)want(ROOMS[i],k,j,j===0);}
function userInput(move=true){lastInput=now();TOUR.paused=true;if(move){if(fly&&!fly.user)fly=null;hideCard();manualSettleAt=0;}}
function stepTour(){
  const t=now();
  if(!TOUR.started&&!TOUR.paused){if(t-T0>4.6&&ROOMS.every(r=>r.ready)){TOUR.started=true;tourNext();}return;}
  if(TOUR.paused){if(t-lastInput>9&&!ptrs.size&&!fly){TOUR.paused=false;TOUR.started=true;
      const c=settled>=0?settled:roomAt(VW/2,VH/2);TOUR.i=c>=0?c:TOUR.i;tourNext();}
    return;}
  if(!fly&&TOUR.holdUntil&&t>TOUR.holdUntil){TOUR.holdUntil=0;tourNext();}
}

// input
const ptrs=new Map();let pinch=null;
cv.addEventListener('pointerdown',e=>{userInput();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);vel={x:0,y:0};fly=null;cv.style.cursor='grabbing';
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;userInput();
  if(ptrs.size===1){cam.x-=dx/cam.z;cam.y-=dy/cam.z;vel.x=lerp(vel.x,-dx/cam.z*60,.5);vel.y=lerp(vel.y,-dy/cam.z*60,.5);clampCam();dirty=true;}
  else if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    cam.x-=(mx-pinch.mx)/cam.z;cam.y-=(my-pinch.my)/cam.z;zoomAt(mx,my,d/pinch.d);pinch={d,mx,my};}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)cv.style.cursor='grab';lastInput=now();};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();userInput();fly=null;const k=e.deltaMode===1?.05:e.deltaMode===2?1:.0016;zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*k*(e.ctrlKey?2.2:1)));},{passive:false});
cv.addEventListener('dblclick',e=>{const i=roomAt(e.clientX,e.clientY);userInput();if(i>=0){TOUR.i=i;flyTo(roomView(i),null,()=>settle(i));fly.user=1;}});
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key,step=Math.min(VW,VH)*.35/cam.z;
  if(k==='c'||k==='C'){cardEnabled=!cardEnabled;if(cardEnabled&&settled>=0)showCard(settled);else if(!cardEnabled)hideCard(true);return;}
  const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(moves[k]){userInput();fly=null;vel.x+=moves[k][0]*step*2.2;vel.y+=moves[k][1]*step*2.2;e.preventDefault();}
  else if(k==='+'||k==='='){userInput();const z=clamp(cam.z*1.4,zMin(),zMax());flyTo({x:cam.x,y:cam.y,z},.45);fly.user=1;}
  else if(k==='-'||k==='_'){userInput();const z=clamp(cam.z/1.4,zMin(),zMax());flyTo({x:cam.x,y:cam.y,z},.45);fly.user=1;}
  else if(k==='0'){userInput();flyTo({x:SW/2,y:SH/2,z:fitSheetZ()},1.2);fly.user=1;}
});
function stepInertia(dt){if(ptrs.size||fly)return;const sp=Math.hypot(vel.x,vel.y);if(sp<.5/cam.z){vel.x=vel.y=0;return;}
  cam.x+=vel.x*dt;cam.y+=vel.y*dt;const f=Math.exp(-dt*4);vel.x*=f;vel.y*=f;clampCam();dirty=true;lastInput=now();}

/* =====================================================================
   12. The chapter card
   ===================================================================== */
const card=document.getElementById('card'),cardGrain=card.querySelector('canvas');let cardEnabled=true,cardRoom=-1;
const ROMAN=r=>r.n;
function settle(i){settled=i;showCard(i);}
function showCard(i){if(!cardEnabled)return;const r=ROOMS[i],acc=INKS[r.accent].hex;
  if(cardRoom!==i){cardRoom=i;card.style.setProperty('--a',acc);
    const q='“'+r.quote+'”';
    card.querySelector('.in').innerHTML=`<p class="ch">Chapter ${ROMAN(r)}</p><h1>${r.title}</h1><div class="orn" aria-hidden="true"><span>❦</span></div><blockquote><p>${q}</p></blockquote>`+
      (r.meta.length?`<p class="meta">${r.meta.join('<br>')}</p>`:'')+(r.links.length?`<p class="links">${r.links.map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">${l}</a>`).join('<span>·</span>')}</p>`:'');}
  card.classList.add('on');requestAnimationFrame(paintCard);}
function hideCard(){card.classList.remove('on');settled=-1;}
function paintCard(){const w=card.offsetWidth,h=card.offsetHeight,d=Math.min(2,devicePixelRatio||1);cardGrain.width=w*d;cardGrain.height=h*d;
  const c=cardGrain.getContext('2d'),pen=new Pen(c,d*R1*1.4,1,0,0,0),pa=new Path2D();pa.rect(0,0,w*d,h*d);pen.paper(pa,'nonzero');
  const r=ROOMS[cardRoom];if(!r)return;const band=new Path2D();band.rect(0,0,w*d,7*d);pen.ink(band,r.accent,1,'nonzero');
  const dots=new Path2D();dots.rect(0,7*d,w*d,5*d);pen.ink(dots,r.accent,.35,'nonzero');}

/* =====================================================================
   13. Frame loop
   ===================================================================== */
const BG='#2c2a28';let lastT=now(),lastTick=-1,lastBoil=-1;
const base=mkCanvas(2,2),bctx=base.getContext('2d');let baseKey='',bakeVer=0;
function render(t){
  const W=cv.width,H=cv.height,s=cam.z*DPR,sx=x=>(x-cam.x)*s+W/2,sy=y=>(y-cam.y)*s+H/2;
  const kp=clamp(Math.round(s/R1),1,KMAX),boil=Math.floor(t*3)%3,need=clamp(Math.ceil(s/R1-.25),1,KMAX);
  let revealing=false;const vis=[];
  for(const r of ROOMS){const rx=sx(r.x),ry=sy(r.y),rw=CW*s,rh=CH*s;if(rx>W||ry>H||rx+rw<0||ry+rh<0)continue;
    if(need>1&&r.ready&&TOUR.started)for(let v=0;v<3;v++)want(r,need,v,v===0);
    const start=r.ready?Math.max(r.ready,T0+.7+r.i*.22):1e9,rv=clamp((t-start)/1.1,0,1);if(rv>0&&rv<1)revealing=true;
    vis.push({r,rx,ry,rw,rh,rv});}
  const key=[W,H,cam.x,cam.y,cam.z,boil,bakeVer].join()+(revealing?t:'');
  if(key!==baseKey){baseKey=key;if(base.width!==W||base.height!==H){base.width=W;base.height=H;}
    const c=bctx;c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='source-over';c.fillStyle=BG;c.fillRect(0,0,W,H);
    c.fillStyle='rgba(0,0,0,.4)';c.fillRect(sx(16),sy(22),SW*s,SH*s);
    const pen=new Pen(c,s,kp,boil,sx(0),sy(0)),pa=new Path2D();pa.rect(sx(0),sy(0),SW*s,SH*s);pen.paper(pa,'nonzero');
    for(const op of CHROME)play(op,pen);
    c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
    for(const {r,rx,ry,rw,rh,rv} of vis){if(rv<=0)continue;const img=pickBake(r,need,boil);if(!img)continue;
      if(rv<1){c.save();c.beginPath();c.rect(rx,ry,rw,rh*smooth(rv));c.clip();c.drawImage(img,rx,ry,rw,rh);c.restore();
        c.fillStyle='rgba(61,85,136,.35)';c.fillRect(rx,ry+rh*smooth(rv)-2*DPR,rw,2*DPR);}
      else c.drawImage(img,rx,ry,rw,rh);}
  }
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.drawImage(base,0,0);
  // people: each room's figures are drawn on twos into a layer that shares the room's dot screen
  const tick=Math.floor(t*12),tq=tick/12,sL=kp*R1;
  for(const r of ROOMS)if(r.fl&&!vis.some(v=>v.r===r))r.fl=null;
  for(const {r,rx,ry,rw,rh,rv} of vis){if(rv<1)continue;
    const flat=150*FIGSC*s<80,fk=tick+'|'+boil+'|'+kp+flat;
    if(!r.fl||r.fl.k!==kp){r.fl=mkCanvas(CW*sL,CH*sL);r.fl.k=kp;r.flKey='';}
    if(r.flKey!==fk){r.flKey=fk;const c=r.fl.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,r.fl.width,r.fl.height);
      const fp=new Pen(c,sL,kp,boil,0,0);fp.ds=s;fp.flat=flat;
      const list=r.figs.map(F=>{const a=figAt(F,tq);return{F,d:a.x+a.y};}).sort((a,b)=>a.d-b.d);
      for(const {F} of list)drawFig(fp,F,tq);}
    ctx.drawImage(r.fl,rx,ry,rw,rh);}
  return revealing;
}
function loop(){
  const t=now(),dt=Math.min(.05,t-lastT);lastT=t;
  stepFly();stepInertia(dt);stepTour();
  if(TOUR.paused&&!fly&&!ptrs.size&&t-lastInput>.7&&settled<0&&!manualSettleAt){manualSettleAt=t;const i=roomAt(VW/2,VH/2);
    if(i>=0&&cam.z>=roomView(i).z*.7)settle(i);}
  const baked=stepBake(TOUR.started?7:14);
  const tick=Math.floor(t*12),boil=Math.floor(t*3);
  if(baked)bakeVer++;
  if(dirty||baked||tick!==lastTick||boil!==lastBoil){dirty=render(t);lastTick=tick;lastBoil=boil;}
  requestAnimationFrame(loop);
}
function start(){
  recordRooms();resize();
  Object.assign(cam,{x:SW/2,y:SH/2,z:fitSheetZ()});
  ROOMS.forEach(r=>want(r,1,0));ROOMS.forEach(r=>{want(r,1,1);want(r,1,2);});
  T0=now();addEventListener('resize',resize);requestAnimationFrame(loop);
}
start();
</script>
</body>
</html>
